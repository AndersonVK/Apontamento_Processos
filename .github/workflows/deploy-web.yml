name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main, claude/internal-app-task-tracking-2nZnA]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores públicos por design (a segurança dos dados está nas regras RLS do Supabase)
      EXPO_PUBLIC_SUPABASE_URL: https://bsjjrtohehedbtjmebva.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_3YyT7X4cuirf_4S4Wiwrig_ytlF2ytF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # O site fica em /<nome-do-repo>; só aplicado no CI para não afetar o dev local
      - name: Set base URL
        run: |
          jq '.expo.experiments.baseUrl = "/Apontamento_Processos"' app.json > app.tmp && mv app.tmp app.json
      - run: npx expo export --platform web
      - name: SPA fallback for Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
